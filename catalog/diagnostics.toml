# Catalogo de diagnosticos del compilador Vesta.
#
# Cada entrada es un CODIGO estable (VXNNNN) + el mensaje por idioma.  El codigo
# es lo PERMANENTE: la documentacion, las busquedas y las herramientas lo
# referencian, no el texto.  Cambiar la redaccion NO cambia el codigo.
#
# Placeholders posicionales {0}, {1}, ...  se sustituyen por los ARGS (datos) que
# pasa el emisor -- nunca se interpola texto crudo en el mensaje.
#
# ANADIR UN IDIOMA es trivial: se anade su codigo ISO a `languages` y su clave a
# cada entrada, y se regenera con tools/import/gen_diag_catalog.py.  NO se traduce
# NUNCA: keywords del lenguaje, atributos, nombres de tipos, identificadores del
# usuario ni los propios codigos de diagnostico.
#
# Numeracion por componente: VX0xxx lexer | VX1xxx parser | VX2xxx type-checker |
# VX3xxx lowering/IR | VX4xxx linker/modulos | VX5xxx codegen/AOT | VX6xxx VPP |
# VXAxxx asm/ASA | VXFxxx formateador | VX9xxx CLI/driver.

[meta]
# El ORDEN fija el indice interno de idioma (0 = primero = fallback).
languages = ["en", "es"]

# --- asm / ASA (VXAxxx) ---

[VXA001]
en = "asm: dead code: unreachable instruction in the asm block"
es = "asm: codigo muerto: instruccion inalcanzable en el bloque asm"

[VXA002]
en = "asm: jump to label '{0}' not defined in the asm block"
es = "asm: salto a etiqueta '{0}' no definida en el bloque asm"

[VXA003]
en = "asm: infinite loop: control cannot leave the asm block"
es = "asm: bucle sin salida: el flujo no puede abandonar el bloque asm"

[VXA004]
en = "asm: register '{0}' read uninitialized in the asm block"
es = "asm: registro '{0}' leido sin inicializar en el bloque asm"

[VXA005]
en = "asm: flags read without a prior comparison/operation in the asm block"
es = "asm: flags leidas sin una comparacion/operacion previa en el bloque asm"

[VXA006]
en = "asm: register '{0}' modified but not declared in clobbers(...) with 'noinfer'"
es = "asm: registro '{0}' modificado pero no declarado en clobbers(...) con 'noinfer'"

[VXA007]
en = "asm: flags are modified but clobbers(\"flags\") is not declared with 'noinfer'"
es = "asm: las flags se modifican pero no se declara clobbers(\"flags\") con 'noinfer'"

[VXA008]
en = "asm: pinning operand '{0}' to '{1}' (the stack/frame pointer) may break the stack. Allowed under your responsibility (some ABIs require it, e.g. Linux x86-32 passes the 6th syscall arg in ebp): save/restore the register yourself or use @Naked to own the stack"
es = "asm: pinear el operando '{0}' a '{1}' (el puntero de pila/marco) puede romper la pila. Permitido bajo tu responsabilidad (algunos ABIs lo exigen, p.ej. Linux x86-32 pasa el 6o arg de syscall en ebp): salva/restaura el registro tu mismo o usa @Naked para ser dueno de la pila"

[VXA009]
en = "asm: operand '{0}' pinned to '{1}' -- that register is reserved by the runtime in VM mode; this asm block cannot be JIT-compiled (runs in the interpreter)"
es = "asm: operando '{0}' pineado a '{1}' -- ese registro esta reservado por el runtime en modo VM; este bloque asm no se puede compilar en JIT (corre en el interprete)"

[VXA010]
en = "asm: reassigns the stack pointer ('{0}') in a normal function; its epilogue manages the stack, so a persistent stack switch (coroutines/fibers) will not survive the return -- mark the function @Naked to own the stack, or balance the change (restore '{0}') before the block ends"
es = "asm: reasigna el puntero de pila ('{0}') en una funcion normal; su epilogue gestiona la pila, asi que un cambio de pila persistente (corrutinas/fibras) no sobrevivira al retorno -- marca la funcion @Naked para ser dueno de la pila, o equilibra el cambio (restaura '{0}') antes de cerrar el bloque"

[VXA011]
en = "asm: '{0}' requires its address ({1}) to be a multiple of {2} bytes -- an unaligned address does not run slower, it faults; the compiler cannot prove it here, so state the precondition or use the form that requires no alignment"
es = "asm: '{0}' exige que su direccion ({1}) sea multiplo de {2} bytes -- una direccion no alineada no va mas lenta, hace caer el programa; el compilador no puede demostrarlo aqui, asi que declara la precondicion o usa la forma que no exige alineacion"

[VXA012]
en = "asm: '{0}' requires an aligned address, but its width cannot be determined from the operands -- the requirement cannot be checked"
es = "asm: '{0}' exige una direccion alineada, pero su ancho no se puede determinar por los operandos -- el requisito no se puede comprobar"

[VXA013]
en = "asm: '{0}' requires its address to be a multiple of {1} bytes, and it is not: the address is congruent with {2} modulo {3} -- this does not run slower, it faults"
es = "asm: '{0}' exige que su direccion sea multiplo de {1} bytes, y no lo es: la direccion es congruente con {2} modulo {3} -- esto no va mas lento, hace caer el programa"

# --- type-checker (VX2xxx) ---

[VXA014]
en = "asm: cannot prove where this block writes ({0}), so writing past what the caller reserved would go unnoticed -- state the extent or use a form the analysis can bound"
es = "asm: no se puede demostrar donde escribe este bloque ({0}), asi que escribir mas alla de lo que reservo el llamante pasaria inadvertido -- declara la extension o usa una forma que el analisis pueda acotar"

[VXA015]
en = "the access has no known width: the operand that gives it was chosen by the compiler and its class does not say how many bytes it is"
es = "el acceso no tiene ancho conocido: el operando que lo da lo eligio el compilador y su clase no dice cuantos bytes mide"

[VXA016]
en = "the block branches, so what comes after cannot be attributed to a fixed distance from the base"
es = "el bloque salta, asi que lo que viene despues no se puede atribuir a una distancia fija de la base"

[VXA017]
en = "the base '{0}' is not bound to a single value here"
es = "la base '{0}' no esta ligada a un solo valor aqui"

[VXA018]
