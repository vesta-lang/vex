es = "al compilar '{2}': no hay tabla de efectos para {1}, asi que nadie puede decir que toca la MOp {0} -- hay que declararla en src/jit/sched/isa_effects_{1}.cpp y nombrarla en isa_effects()"

# --- una funcion que no dijo para donde se compila (VXA070) ---
#
# La convencion de llamada NO es la del anfitrion: un binario para Linux
# generado desde Windows usa otra, y sus dos primeros argumentos viajan en
