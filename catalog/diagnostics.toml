es = "asm: este bloque se queda opaco -- no se optimiza, y de lo que hace solo se sabe lo que diga su tabla de instrucciones. El ultimo intento de pasarlo a IR se atasco en '{0}' ({1}): {2}"

[VXA019]
en = "general-purpose instruction: it can be modelled in IR and simply is not yet"
es = "instruccion de proposito general: se puede modelar en IR y simplemente aun no lo esta"

[VXA020]
en = "instruction specific to {0}: it will never be IR, and that is fine -- what it should do is stay as micro asm the IR can analyse, with its effects from the instruction database"
es = "instruccion especifica de {0}: nunca sera IR, y esta bien -- lo que deberia es quedarse como micro asm que el IR pueda analizar, con sus efectos de la base de instrucciones"

[VXA021]
en = "the instruction database does not know it, so not even what it does is known: add it to the database"
es = "la base de instrucciones no la conoce, asi que no se sabe ni lo que hace: anadela a la base"

# Por que se atasco el intento de pasar un bloque asm a IR.  Van dentro de
# VXA018 como {2}: son el final de la frase, no oraciones completas.

[VXA022]
en = "no operand of it was recognised"
es = "no se le reconocio ningun operando"

[VXA023]
en = "it uses the operand '{0}', which the lift does not turn into IR yet"
es = "usa el operando '{0}', que el elevado aun no pasa a IR"

[VXA024]
en = "it touches a register bound to a variable, and that is still resolved by the opaque path"
es = "toca un registro ligado a una variable, y eso todavia se resuelve por el camino opaco"

[VXA025]
en = "the instruction database does not say whether that operand is read or written"
es = "la base de instrucciones no dice si ese operando se lee o se escribe"

[VXA026]
en = "by convention it touches '{0}', a register that could not be named"
es = "toca por convencion '{0}', un registro que no se supo nombrar"

[VXA027]
en = "the block has no instructions"
es = "el bloque no tiene instrucciones"

[VXA028]
en = "it carries an operand the compiler picks ($N), and that is still resolved by the opaque path"
es = "lleva un operando que elige el compilador ($N), y eso todavia se resuelve por el camino opaco"

[VXA029]
