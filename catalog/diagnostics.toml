# --- una instruccion sin efectos declarados (VXA068) ---
#
# Quien optimiza se fia de lo que cada instruccion LEE y ESCRIBE para decidir
# que puede mover y que puede borrar.  Si una llega sin que nadie sepa
# contestar por ella, lo que hay es un objetivo al que se le olvido declarar
# algo suyo.
#
# Antes esto no existia: habia un caso por defecto que daba por leidos y
# escritos todos los operandos, la memoria y las banderas, y ademas marcaba
# barrera.  O sea "no se sabe" con otro nombre.  Con eso, una instruccion sin
# declarar no daba ningun aviso -- solo hacia que el optimizador no tocara
# nada a su alrededor --, y asi llevaban tiempo cuatro operaciones de coma
# flotante fusionada, en silencio.  {0} es lo que falta, {1} el numero de la
# operacion, {2} la arquitectura.

[VXA068]
en = "while compiling '{2}': MOp {0} does not say which registers it touches, and nothing answers for it on {1}. An instruction's effects are never guessed: declare them in isa_effects_{1}.cpp -- its mnemonic if the ISA has that instruction, its case in `pseudo` if it is one of ours -- or in `generic_pseudo` when everything it touches is already in its operands"
es = "al compilar '{2}': la MOp {0} no dice que registros toca, y para {1} no hay quien lo conteste.  Los efectos de una instruccion no se adivinan: hay que declararlos en isa_effects_{1}.cpp -- su mnemonico si la ISA tiene esa instruccion, su caso en `pseudo` si es de las nuestras -- o en `generic_pseudo` si todo lo que toca ya esta en sus operandos"

# --- una arquitectura sin tabla de efectos (VXA069) ---
#
# El eje de arquitectura tiene cuatro valores y no todas han declarado la suya.
# Coger la de otra es dar registros que esa maquina no tiene.

[VXA069]
