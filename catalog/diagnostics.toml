es = "lee {0}, que viene de fuera del bloque"

[VXA035]
en = "it is a jump ('{0}'): control flow is the IR's, not one instruction's -- that is for the general lift, which builds the graph"
es = "es un salto ('{0}'): el flujo de control lo lleva el IR, no una instruccion suelta -- eso es del elevado general, que construye el grafo"

[VXA032]
en = "(which one is not on record)"
