[VXW903]
en = "vesta lint <file.vx> [--only <family>]..."
es = "vesta lint <fichero.vx> [--only <familia>]..."

[VXW904]
en = "Families:"
es = "Familias:"

[VXW910]
en = "a declared bound looser than what was proven, and properties provable but not declared"
es = "una cota declarada mas floja que la demostrada, y propiedades demostrables sin declarar"

[VXW911]
en = "what one boundary costs: how many functions cannot prove their effects because the closure leaves the program there"
es = "lo que cuesta una frontera: cuantas funciones no pueden demostrar sus efectos porque el cierre sale del programa por ahi"

# --- el mismo coste, pero por una llamada que no se resuelve (VXW005) ---
#
# Se separa de VXW004 porque se arregla de otra forma: alli el destino se sabe
# y esta fuera del programa; aqui el destino ni se sabe.  Lo segundo SI puede
# mejorar con el analisis -- resolver el puntero a funcion -- y lo primero no.

[VXW005]
en = "{0} function(s) here cannot prove their effects (@pure, @nothrow, @nopanic, @alloc, @stack) because their call closure reaches a call whose target is not resolved -- unlike a boundary that leaves the program, this one is the analysis falling short: resolve the target and all {0} follow (first one: '{2}')"
es = "{0} funcion(es) de aqui no pueden demostrar sus efectos (@pure, @nothrow, @nopanic, @alloc, @stack) porque su cierre de llamadas llega a una llamada cuyo destino no se resuelve -- a diferencia de una frontera que sale del programa, esta es el analisis quedandose corto: si el destino se resuelve, las {0} salen con el (la primera: '{2}')"

# --- la direccion: la contradiccion con `const` (VXT006) ---
#
# Es el UNICO codigo propio que necesita la marca, y merece la pena entender
# por que.  `const` y la direccion son dos ejes distintos, a proposito: `const`
# es un permiso POR NIVEL sobre el tipo -- lo mismo que en C, donde `const T*`
# y `T* const` no son lo mismo --, mientras que la direccion habla del nivel
# EXTERNO.  Por eso `in T const*` es correcto (y algo redundante) y
# `out T const**` tambien lo es -- se escribe el nivel de fuera y lo de dentro
# sigue siendo const --; solo choca cuando la promesa de escribir cae justo
# sobre el nivel declarado no escribible.
#
# Lo demas NO tiene codigo propio, y es deliberado:
#
#   - Escribir por un `in` sale por el camino de `const`, que ya existe y es
#     uniforme ("escribir a un lvalue const es error").  Aqui hubo un VXT007
#     para eso; se quito al ver que nadie lo emitia.  Una entrada del catalogo
#     que ningun sitio usa es una mentira silenciosa sobre lo que el compilador
#     sabe decir: aparece en la lista y no sale nunca.
#   - `in` sobre un valor es LEGAL (una copia de solo lectura), asi que el
#     VXT005 que rechazaba la marca sobre algo que no apunta se quedo tambien
#     sin emisor y se fue con el.
#   - `out` sobre un valor tiene el suyo, VXT009, porque no dice "esto esta
#     mal" sino "esto significa otra cosa y aun no esta conectada".

[VXT006]
en = "'{0}' is marked '{1}' -- it promises to write what it points to -- but what it points to is declared 'const'"
es = "'{0}' lleva '{1}' -- promete escribir lo que apunta -- pero lo que apunta esta declarado 'const'"

# --- dos definiciones de la misma nativa que no coinciden (VXT008) ---
#
# La misma funcion del sistema declarada en dos modulos que dicen cosas
# distintas es un caso normal, no exotico.  Antes ganaba la primera y la otra
# desaparecia sin dejar rastro: el programa se compilaba segun el ORDEN en que
# se emitieron las llamadas, que no es una propiedad del programa.
#
# Se avisa y se sigue con la union de lo PEOR de las dos.  Perder precision es
# aceptable; afirmar de menos no.  Por eso es aviso y no error: quien lo lee
# puede no ser el dueno de los dos modulos, y el compilador ya se ha puesto a
# salvo solo.
#
# OJO: dos definiciones para OBJETIVOS distintos no son un conflicto -- son dos
# hechos ciertos, cada uno en su ambito.  Esto solo salta cuando conviven.

[VXT008]
en = "'{0}:{1}' is defined twice with different effects ({2}); continuing with the union of the worst of both, so some caller may fail to prove effects it could otherwise prove"
es = "'{0}:{1}' esta definida dos veces con efectos distintos ({2}); se sigue con la union de lo peor de las dos, asi que algun llamante puede quedarse sin demostrar efectos que si podria"

# --- `out` sobre un valor: parametro de SALIDA (VXT009) ---
#
# `out i32 x` tiene un significado obvio y util -- el de C# o Ada --: quien
# llama cede un hueco y el llamado lo escribe.  Baja a lo que ya existe (un
# `T*` con `&` en el sitio de llamada), pero eso es reescribir la llamada, y
# hasta que ese paso este hecho es mejor decirlo que aceptarlo sin hacerlo:
# aceptar la marca y no cumplirla es peor que rechazarla, porque el programa
# parece decir algo que no ocurre.

[VXT009]
en = "'{0}' is marked '{1}' on a value ('{2}'), and there is no caller here to yield a slot: on a PARAMETER that mark is the output-parameter form -- the caller passes the place and the callee writes it -- but a variable or a field has nobody to receive from; if what you want is to write through it, declare it as a pointer ('{2}*')"
es = "'{0}' lleva '{1}' sobre un valor ('{2}'), y aqui no hay ningun llamante que ceda un hueco: en un PARAMETRO esa marca es la forma de salida -- quien llama pasa el sitio y el llamado lo escribe -- pero una variable o un campo no tienen de quien recibirlo; si lo que quieres es escribir a traves de el, declaralo como puntero ('{2}*')"

# --- la direccion sobre un tipo de RETORNO (VXT010) ---
#
# `in`/`out`/`inout` dan un PERMISO sobre lo que algo apunta, y un permiso se le
# da a alguien: a un parametro, a una variable, a un campo.  Un tipo de retorno
# no es nadie -- el valor sale y quien lo recibe ya decidira que declara --, asi
# que la marca ahi no tiene a quien obligar.
#
# Se rechaza en vez de ignorarse: aceptarla y no hacer nada seria escribir algo
# que parece decir una cosa y no ocurre, que es peor que no poder escribirlo.

[VXT010]
en = "'{0}' is marked '{1}' on its return type: the mark grants a permission over what something POINTS TO, and a return type is nobody to grant it to -- put it on the parameter, variable or field that receives the value"
es = "'{0}' lleva '{1}' en su tipo de retorno: la marca da un permiso sobre lo que algo APUNTA, y un tipo de retorno no es nadie a quien darselo -- ponla en el parametro, la variable o el campo que recibe el valor"

# --- argumento de un parametro de SALIDA (VXT011) ---
#
# `out T x` es un hueco que el llamado escribe, asi que lo que se le pasa tiene
# que ser un SITIO: un nombre, un campo, un elemento de array o un deref.  Una
# expresion calculada no tiene donde recibir el resultado.

[VXT011]
en = "argument {0} is passed to an '{1}' parameter, which the callee writes: it needs somewhere to write to (a name, a field, an array element or a dereference), not a computed value"
es = "el argumento {0} va a un parametro '{1}', que el llamado ESCRIBE: necesita un sitio donde escribir (un nombre, un campo, un elemento de array o un deref), no un valor calculado"

# --- un parametro de SALIDA que nadie escribe (VXT012) ---
#
# `out T x` PROMETE que quien llama recibira un valor.  Si el cuerpo no lo
# escribe nunca, el llamante lee lo que hubiera en su hueco: la marca prometeria
# y no cumpliria, que es justo lo que no puede pasar.
#
# Se comprueba que se escriba ALGUNA vez, no que se escriba en todos los
# caminos.  Lo segundo pide analisis de flujo y esta sin hacer; lo primero coge
# el fallo real -- declararlo y olvidarse -- y no puede dar un falso positivo
# sobre codigo que si lo escribe.

[VXT012]
en = "'{0}' is declared 'out' -- the caller expects to get a value back through it -- but this body never writes it; assign it, or declare it 'inout' if what you want is to read what came in"
es = "'{0}' se declara 'out' -- quien llama espera recibir un valor por ahi -- pero este cuerpo no lo escribe nunca; asignalo, o declaralo 'inout' si lo que quieres es leer lo que venia"
